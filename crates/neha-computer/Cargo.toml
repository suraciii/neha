[package]
name = "neha-computer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# What the integration tests need from inside the crate. `cargo test --all-features`
# turns it on; a production build does not compile it.
test-support = []

[dependencies]
neha = { path = "../neha" }
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "rt", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# The workspace forbids unsafe code; this crate narrows that to the libc calls
# a Computer needs: killing a shell's whole process group, writing through
# directory file descriptors so no symlink or hard link is followed, and
# keeping the verified Bot folder descriptor open across the sandbox exec so
# bubblewrap binds that object instead of a path it can no longer trust.
[lints.rust]
unsafe_code = "allow"
