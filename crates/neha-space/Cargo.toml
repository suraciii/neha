[package]
name = "neha-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
eventsource-stream = "0.2"
flate2 = "1"
tar = "0.4"
futures-util.workspace = true
libc = "0.2"
neha = { path = "../neha" }
neha-computer = { path = "../neha-computer" }
neha-loop = { path = "../neha-loop" }
opendal.workspace = true
rand = "0.9"
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"
serde_json.workspace = true
serde_norway = "0.9.42"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "process", "rt", "sync", "time"] }
toml.workspace = true

[target.'cfg(unix)'.dependencies]
# The stdio sandbox's working-directory walk binds each step to an opened
# directory descriptor; this is the safe wrapper over the calls it needs.
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
# The unsandboxed stdio launcher puts the child in a Job Object so its
# descendants die with the client even after the launcher exits.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.29"

# The workspace forbids unsafe code; this crate narrows that to the Win32 Job
# Object calls the Windows stdio launcher needs (creates a job that kills its
# processes when its handle closes, and assigns the child to it). Every unsafe
# block in the crate is in the one `#[cfg(windows)]` module in `stdio.rs`; no
# code path on Linux, macOS, or any other platform uses unsafe.
[lints.rust]
unsafe_code = "allow"
