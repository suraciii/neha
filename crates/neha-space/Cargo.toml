[package]
name = "neha-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
eventsource-stream = "0.2"
futures-util.workspace = true
neha = { path = "../neha" }
neha-computer = { path = "../neha-computer" }
neha-loop = { path = "../neha-loop" }
rand = "0.9"
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.29"

[lints]
workspace = true
