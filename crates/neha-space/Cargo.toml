[package]
name = "neha-space"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# What the integration tests need from inside the crate. `cargo test --all-features`
# turns it on; a production build does not compile it.
test-support = []

[dependencies]
ts-rs.workspace = true
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["http1", "json", "tokio", "ws"] }
base64 = "0.22"
eventsource-stream = "0.2"
flate2 = "1"
futures-util.workspace = true
neha = { path = "../neha" }
neha-computer = { path = "../neha-computer" }
neha-loop = { path = "../neha-loop" }
opendal.workspace = true
rand = "0.9"
reqwest = { workspace = true, features = ["json", "query", "rustls", "stream"] }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.11"
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "net", "rt", "sync", "time"] }
toml.workspace = true
sad-web-push = { version = "0.12", default-features = false }
p256 = { version = "0.14", features = ["ecdh", "ecdsa"] }

[dev-dependencies]
hkdf = "0.13"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = "0.29"

[lints]
workspace = true

# The Space's integration tests, one binary.
[[test]]
name = "it"
required-features = ["test-support"]

# The replay benchmark. `test = false` keeps `cargo test` (and `just ci`) from
# running it: a bench target is a test target by default, and with
# `harness = false` that would execute the whole benchmark inside the gate.
[[bench]]
name = "replay"
harness = false
test = false
