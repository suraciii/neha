[package]
name = "neha-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# What the integration tests need from inside the crate. `cargo test --all-features`
# turns it on; a production build does not compile it.
test-support = []

[[bin]]
name = "neha"
path = "src/main.rs"
doc = false

[[test]]
name = "it"
required-features = ["test-support"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util.workspace = true
neha = { path = "../neha" }
neha-computer = { path = "../neha-computer" }
neha-space = { path = "../neha-space" }
rand = "0.9"
reqwest = { workspace = true, features = ["json", "query", "rustls"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
axum = { version = "0.8", features = ["http1", "tokio"] }
tempfile = "3"

[lints]
workspace = true
