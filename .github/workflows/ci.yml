name: CI

# A pull request gates the change on Linux and Windows in parallel; a merge
# re-runs the gate on main. Packaging runs in nightly.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Pull requests replace their superseded run; merges queue, so a burst of
  # merges runs the newest commit instead of each one.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: Verification gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # No debug symbols in CI.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      # Run the fence and S3 tests against the package and store below.
      NEHA_TEST_BWRAP: '1'
      NEHA_TEST_S3: '1'
      NEHA_TEST_S3_ENDPOINT: 'http://127.0.0.1:8333'
      NEHA_TEST_S3_BUCKET: 'neha'
      NEHA_TEST_S3_REGION: 'us-east-1'
      AWS_ACCESS_KEY_ID: 'neha'
      AWS_SECRET_ACCESS_KEY: 'neha-secret'
      # The configured endpoint must win: this URL is a trap.
      AWS_ENDPOINT_URL: 'http://127.0.0.1:1'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # Ubuntu 24.04 blocks unprivileged user namespaces, and this bubblewrap is
      # not setuid.
      - name: Prepare the fence sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev-bind /dev /dev --proc /proc -- /bin/true

      - name: Start the S3 test store
        run: eng/s3.sh up

      - name: Run gate with evidence
        run: just verify "$RUNNER_TEMP/verification"

      - name: Collect the S3 store's logs
        if: failure()
        run: eng/s3.sh logs || true

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence
          path: ${{ runner.temp }}/verification
          if-no-files-found: error

  # Windows-only code does not compile on Linux.
  windows:
    name: Windows check
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Check the Rust workspace
        run: cargo check --locked --workspace

      - name: Test the Windows runtime
        run: cargo test --locked -p neha-computer --test windows_shell
