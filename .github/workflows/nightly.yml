name: Nightly installer

# Packaging is the slowest job, so it runs once a night and only when main moved
# since the last successful run. Dispatch it to rebuild on demand.
on:
  schedule:
    # 02:00 Asia/Shanghai.
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-installer
  cancel-in-progress: true

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      # The last successful run records the commit it saw.
      - name: Compare main with the last nightly
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          last=$(gh run list --workflow=nightly.yml --branch=main --status=success \
            --limit=1 --json headSha --jq '.[0].headSha // ""')
          changed=true
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then changed=false; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "head $GITHUB_SHA, last successful nightly ${last:-none}"

  installer:
    name: Windows installer
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.21.0

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Build the Windows sidecar
        run: cargo build --locked --release -p neha-app

      - name: Test the Windows runtime
        run: cargo test --locked -p neha-computer --test it

      - name: Install the UI
        run: pnpm --dir ui install --frozen-lockfile

      - name: Build the UI
        # The Linux gate owns UI behavior tests; Windows only needs the native
        # Vite build and the packaging path. The jsdom tests exceed their 5s
        # per-test budget on the Windows runner.
        run: pnpm --dir ui build

      - name: Install the desktop shell
        run: pnpm --dir apps/desktop install --frozen-lockfile

      - name: Test the desktop shell
        run: pnpm --dir apps/desktop test

      - name: Build the Windows installer
        run: pnpm --dir apps/desktop package:win

      - name: Upload the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neha-windows-installer
          path: apps/desktop/dist/Neha-Setup-*.exe
          retention-days: 14
          if-no-files-found: error

      - name: Install the Windows app
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/dist/Neha-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw "installer was not built" }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "installer exited $($process.ExitCode)" }
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Filter Neha.exe |
            Where-Object { Test-Path (Join-Path $_.Directory "resources\neha.exe") } |
            Select-Object -First 1
          if (-not $app) { throw "Neha.exe or its sidecar was not installed" }
          if (-not (Test-Path (Join-Path $app.Directory "resources\ui\index.html"))) {
            throw "the installed UI is missing"
          }
          if (-not (Test-Path (Join-Path $app.Directory "resources\ui\desktop.html"))) {
            throw "the installed Space chooser is missing"
          }
          Write-Host "installed $($app.FullName)"
          & (Join-Path $app.Directory "resources\neha.exe") --version | Write-Host

      - name: Launch the installed desktop app
        shell: pwsh
        run: |
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Filter Neha.exe |
            Where-Object { Test-Path (Join-Path $_.Directory "resources\neha.exe") } |
            Select-Object -First 1
          if (-not $app) { throw "Neha.exe was not installed" }
          $env:NEHA_DESKTOP_HOME = Join-Path $env:RUNNER_TEMP "neha-desktop-home"
          Remove-Item -Recurse -Force $env:NEHA_DESKTOP_HOME -ErrorAction SilentlyContinue
          $env:NEHA_DESKTOP_CAPTURE = Join-Path $env:RUNNER_TEMP "neha-desktop-chooser.png"
          $stderr = Join-Path $env:RUNNER_TEMP "neha-desktop.err.log"
          $stdout = Join-Path $env:RUNNER_TEMP "neha-desktop.out.log"
          $process = Start-Process -FilePath $app.FullName `
            -ArgumentList "--no-sandbox", "--disable-gpu", "--headless" -PassThru `
            -RedirectStandardError $stderr -RedirectStandardOutput $stdout
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force
            throw "the desktop app did not exit"
          }
          if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
          if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
          if ($process.ExitCode -ne 0) { throw "the desktop app exited $($process.ExitCode)" }
          if (-not (Test-Path $env:NEHA_DESKTOP_CAPTURE)) { throw "the desktop app did not write a chooser screenshot" }
          if (-not (Select-String -Path $stderr -Pattern "loaded the Space chooser" -Quiet)) {
            throw "the first launch did not open the Space chooser"
          }
          if (Select-String -Path $stderr -Pattern "starting the local Space" -Quiet) {
            throw "the chooser must not start a Space before the User chooses"
          }
          Write-Host "chooser screenshot: $env:NEHA_DESKTOP_CAPTURE"

      - name: Open the local Space sign-in page
        shell: pwsh
        run: |
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Filter Neha.exe |
            Where-Object { Test-Path (Join-Path $_.Directory "resources\neha.exe") } |
            Select-Object -First 1
          if (-not $app) { throw "Neha.exe was not installed" }
          $localHome = Join-Path $env:RUNNER_TEMP "neha-desktop-local"
          Remove-Item -Recurse -Force $localHome -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $localHome | Out-Null
          Set-Content -Path (Join-Path $localHome "desktop-space.json") `
            -Value '{"version":1,"mode":"local","localComputer":false}' -Encoding ascii
          $env:NEHA_DESKTOP_HOME = $localHome
          $env:NEHA_DESKTOP_CAPTURE = Join-Path $env:RUNNER_TEMP "neha-desktop-local-login.png"
          $stderr = Join-Path $env:RUNNER_TEMP "neha-desktop-local.err.log"
          $stdout = Join-Path $env:RUNNER_TEMP "neha-desktop-local.out.log"
          $process = Start-Process -FilePath $app.FullName `
            -ArgumentList "--no-sandbox", "--disable-gpu", "--headless" -PassThru `
            -RedirectStandardError $stderr -RedirectStandardOutput $stdout
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force
            throw "the local desktop launch did not exit"
          }
          if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
          if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
          if ($process.ExitCode -ne 0) { throw "the local desktop launch exited $($process.ExitCode)" }
          if (-not (Test-Path $env:NEHA_DESKTOP_CAPTURE)) { throw "the local launch did not write a screenshot" }
          if (-not (Select-String -Path $stdout -Pattern "Invite:" -Quiet)) {
            throw "the local Space did not open its invitation page"
          }
          if (Select-String -Path $stderr -Pattern "started the Local Computer" -Quiet) {
            throw "the local Computer must wait for the in-launcher checkbox and a signed-in session"
          }
          Write-Host "local login screenshot: $env:NEHA_DESKTOP_CAPTURE"

      - name: Open a remote Space invitation page
        shell: pwsh
        run: |
          $app = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Filter Neha.exe |
            Where-Object { Test-Path (Join-Path $_.Directory "resources\neha.exe") } |
            Select-Object -First 1
          if (-not $app) { throw "Neha.exe was not installed" }
          $remoteHome = Join-Path $env:RUNNER_TEMP "neha-remote-space"
          Remove-Item -Recurse -Force $remoteHome -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $remoteHome | Out-Null
          $remoteOut = Join-Path $env:RUNNER_TEMP "neha-remote-space.out.log"
          $remoteErr = Join-Path $env:RUNNER_TEMP "neha-remote-space.err.log"
          $env:NEHA_HOME = $remoteHome
          $sidecar = Join-Path $app.Directory "resources\neha.exe"
          $ui = Join-Path $app.Directory "resources\ui"
          $space = Start-Process -FilePath $sidecar `
            -ArgumentList @("serve", "--port", "0", "--ui", $ui) -PassThru `
            -RedirectStandardOutput $remoteOut -RedirectStandardError $remoteErr
          try {
            $url = $null
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              if (Test-Path $remoteOut) {
                $match = Select-String -Path $remoteOut -Pattern "Open in a browser: (\S+)" | Select-Object -First 1
                if ($match) { $url = $match.Matches[0].Groups[1].Value; break }
              }
            }
            if (-not $url) { throw "the remote Space did not print a browser URL" }
            Write-Host "remote Space URL: $url"
            if ($space.HasExited) {
              Get-Content $remoteOut -ErrorAction SilentlyContinue | Write-Host
              Get-Content $remoteErr -ErrorAction SilentlyContinue | Write-Host
              throw "the remote Space exited before the desktop could open it"
            }
            $remotePort = ([Uri]$url).Port
            Start-Sleep -Milliseconds 800
            $probe = New-Object System.Net.Sockets.TcpClient
            try {
              $probe.Connect("127.0.0.1", $remotePort)
              Write-Host "remote Space accepted a connection on 127.0.0.1:$remotePort"
            } catch {
              Get-Content $remoteOut -ErrorAction SilentlyContinue | Write-Host
              Get-Content $remoteErr -ErrorAction SilentlyContinue | Write-Host
              throw "the remote Space did not accept a connection on 127.0.0.1:${remotePort}: $($_.Exception.Message)"
            } finally {
              $probe.Close()
            }
            $desktopHome = Join-Path $env:RUNNER_TEMP "neha-desktop-remote"
            Remove-Item -Recurse -Force $desktopHome -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $desktopHome | Out-Null
            $selection = @{ version = 1; mode = "remote"; spaceUrl = $url } | ConvertTo-Json -Compress
            Set-Content -Path (Join-Path $desktopHome "desktop-space.json") -Value $selection -Encoding ascii
            $env:NEHA_DESKTOP_HOME = $desktopHome
            $env:NEHA_DESKTOP_CAPTURE = Join-Path $env:RUNNER_TEMP "neha-desktop-remote.png"
            $stderr = Join-Path $env:RUNNER_TEMP "neha-desktop-remote.err.log"
            $stdout = Join-Path $env:RUNNER_TEMP "neha-desktop-remote.out.log"
            $process = Start-Process -FilePath $app.FullName `
              -ArgumentList "--no-sandbox", "--disable-gpu", "--headless" -PassThru `
              -RedirectStandardError $stderr -RedirectStandardOutput $stdout
            if (-not $process.WaitForExit(180000)) {
              Stop-Process -Id $process.Id -Force
              throw "the remote desktop launch did not exit"
            }
            if (Test-Path $stderr) { Get-Content $stderr | Write-Host }
            if (Test-Path $stdout) { Get-Content $stdout | Write-Host }
            if ($process.ExitCode -ne 0) { throw "the remote desktop launch exited $($process.ExitCode)" }
            if (-not (Test-Path $env:NEHA_DESKTOP_CAPTURE)) { throw "the remote launch did not write a screenshot" }
            if (-not (Select-String -Path $stderr -Pattern "opened the remote Space at" -Quiet)) {
              throw "the remote Space page did not load"
            }
            if (Select-String -Path $stderr -Pattern "starting the local Space" -Quiet) {
              throw "the remote choice must not start a local Space"
            }
            Write-Host "remote screenshot: $env:NEHA_DESKTOP_CAPTURE"
          } finally {
            if ($space -and -not $space.HasExited) { Stop-Process -Id $space.Id -Force }
          }
