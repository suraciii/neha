name: Bug report
description: Report a reproducible defect
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The command or actions, the input, and the build used.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release version, or the commit the build was made from.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or output
      description: Error messages or command output that show the defect.
      render: shell
