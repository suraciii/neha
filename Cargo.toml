[workspace]
resolver = "3"
members = [
    "crates/neha",
    "crates/neha-app",
    "crates/neha-computer",
    "crates/neha-loop",
    "crates/neha-space",
    "crates/neha-wire",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"
publish = false

# Shared dependency versions live here so a crate declares `foo.workspace = true`
# and one edit updates every crate. Add an entry when a second crate needs the
# same dependency, not in advance.
[workspace.dependencies]
futures-util = "0.3"
opendal = { version = "0.59", default-features = false, features = ["services-fs", "services-s3", "executors-tokio", "http-transport-reqwest"] }
reqwest = { version = "0.13", default-features = false }
serde = "1"
serde_json = "1"
thiserror = "2"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
tokio = "1"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "registry", "std", "tracing-log"] }
json-subscriber = { version = "0.3.1", features = ["tracing-log", "tracing-opentelemetry-0-34"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry-prometheus = "0.33"
prometheus = "0.14"
tracing-opentelemetry = { version = "0.34", default-features = false, features = ["tracing-log"] }

# Workspace-wide lints. `cargo clippy -- -D warnings` turns every warning into a
# failure, so a crate that needs an exception narrows it locally and states why.
[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

# Test codegen. Unoptimized test code makes numerical and rendering suites
# several times slower. opt-level 2 inherits `dev`, so debug assertions and
# overflow checks stay enabled and only code generation differs.
[profile.test]
opt-level = 2
